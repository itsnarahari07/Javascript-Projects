<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <div class="container">

        <h1 id="h1">
            <marquee behavior="alternate" direction="left">Counter Implementation</marquee>
        </h1>
        <br>
        <div id="box">

            <h2 class="count">0</h2>
            <br>
            <button id="increase">Increase</button>
            <button id="reset">Reset</button>
            <button id="decrease">Decrease</button>

        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
